<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zornix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#06080B; --surface:#0A0E13; --surface-2:#0D1218; --tile:#0B1016; --sunken:#080B10;
    --line:#18212B; --line-2:#22303D;
    --text:#E6EDF3; --text-2:#C9D3DD; --muted:#9AA7B5; --faint:#6B7888;
    --accent:#35E0D0; --accent-2:#7FF3E8; --accent-dim:#1F5E5A; --accent-bg:#0C1F22;
    --warn:#FFB547; --warn-dim:#5A4420; --warn-bg:#1A1408;
    --error:#FF7A7A; --error-dim:#5A2A2A;
    --rec-fill:#123532;
    --f-display:'Space Grotesk',system-ui,sans-serif;
    --f-body:Inter,system-ui,-apple-system,sans-serif;
    --f-mono:'JetBrains Mono',ui-monospace,monospace;
    --r:6px; --r-sm:4px; --h:44px;
    --sidebar:248px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:var(--f-body); font-size:14px; -webkit-font-smoothing:antialiased;
    display:grid; grid-template-columns:var(--sidebar) 1fr;
    grid-template-rows:var(--h) 1fr auto;
    grid-template-areas:"side top" "side stage" "side transport";
    transition:grid-template-columns .18s ease;
  }
  body.collapsed{--sidebar:0px}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .mono{font-family:var(--f-mono)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1b2531;border-radius:8px;border:2px solid var(--surface)}
  ::-webkit-scrollbar-thumb:hover{background:#243244}

  /* ---------- SIDEBAR ---------- */
  #sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--line);
     display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px}
  .brand svg{width:30px;height:30px;flex:none}
  .brand .wm{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.14em}
  .nav{display:flex;flex-direction:column;gap:4px;padding:0 12px 12px}
  .nav button{display:flex;align-items:center;gap:12px;min-height:var(--h);padding:0 12px;
     border:1px solid transparent;border-radius:var(--r);color:var(--muted);font-size:14px;font-weight:500;text-align:left}
  .nav button svg{width:18px;height:18px;flex:none;stroke:currentColor}
  .nav button:hover{color:var(--text-2);background:var(--surface-2)}
  .nav button.active{background:var(--accent-bg);border-color:var(--accent-dim);color:var(--accent);font-weight:600}

  .search{margin:2px 14px 10px;position:relative}
  .search input{width:100%;background:var(--sunken);border:1px solid var(--line);color:var(--text);
     border-radius:var(--r);padding:9px 10px 9px 32px;font-size:13px;outline:none;font-family:inherit}
  .search input:focus{border-color:var(--line-2)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--faint)}

  .camlist{flex:1;overflow-y:auto;padding:0 10px}
  .camrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);
     cursor:pointer;margin-bottom:2px;border:1px solid transparent}
  .camrow:hover{background:var(--surface-2)}
  .camrow.sel{background:var(--accent-bg);border-color:var(--accent-dim)}
  .camrow .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .camrow.sel .dot{background:var(--accent)}
  .camrow .nm{min-width:0;flex:1}
  .camrow .nm b{font-weight:550;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .camrow .nm span{color:var(--faint);font-size:11px;font-family:var(--f-mono)}
  .camrow.sel .nm b{color:var(--accent)}
  .camrow .pos{font-family:var(--f-mono);font-size:11px;color:var(--accent);
     background:rgba(53,224,208,.12);border-radius:var(--r-sm);padding:2px 6px}

  .statcard{margin:8px 14px 12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);
     display:flex;flex-direction:column;gap:9px}
  .statcard .h{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
  .statrow{display:flex;justify-content:space-between;align-items:center}
  .statrow .l{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
  .statrow .v{font-family:var(--f-mono);color:var(--text)}
  .sd{width:8px;height:8px;border-radius:50%}
  .sd.live{background:var(--accent)} .sd.conn{border:2px solid var(--warn);box-sizing:border-box}
  .sd.off{width:10px;height:2px;border-radius:0;background:var(--error)}

  .side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .side-foot .count{color:var(--faint);font-size:11px;font-family:var(--f-mono)}

  .btn{display:inline-flex;align-items:center;gap:8px;height:var(--h);padding:0 14px;border-radius:var(--r);
     background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);font-size:14px;font-weight:500}
  .btn:hover{background:#111824}
  .btn svg{width:16px;height:16px}
  .btn.sm{height:38px;padding:0 12px;font-size:13px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn.accent{background:transparent;border-color:var(--accent);color:var(--accent);font-weight:600}
  .btn.accent:hover{background:var(--accent-bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
  .btn.primary:hover{background:var(--accent-2)}

  /* ---------- TOPBAR ---------- */
  #topbar{grid-area:top;background:var(--surface);border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:12px;padding:0 20px}
  #topbar .collapse{width:38px;height:38px;border-radius:var(--r);display:grid;place-items:center}
  #topbar .collapse:hover{background:var(--surface-2)}
  #topbar .collapse svg{width:18px;height:18px;stroke:var(--muted)}
  #viewtitle{font-family:var(--f-display);font-weight:600;font-size:19px}
  #viewtitle small{font-family:var(--f-mono);color:var(--muted);font-weight:400;margin-left:10px;font-size:12px}
  .vlan{font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent-dim);
     border-radius:var(--r-sm);padding:4px 8px;letter-spacing:.08em}
  #topbar .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
  .seg button{min-width:50px;height:var(--h);padding:0 10px;font-family:var(--f-mono);font-size:13px;color:var(--text-2)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.active{background:var(--accent);color:var(--bg);font-weight:500}
  .seg button:hover:not(.active){background:var(--surface-2)}
  .pager{display:flex;align-items:center;gap:4px}
  .pager button{width:var(--h);height:var(--h);border:1px solid var(--line-2);border-radius:var(--r);
     background:var(--surface-2);display:grid;place-items:center}
  .pager button:hover{background:#111824} .pager button svg{width:16px;height:16px;stroke:var(--text)}
  .pager span{min-width:52px;text-align:center;font-family:var(--f-mono);font-size:13px}
  .datefield{display:flex;align-items:center;gap:8px}
  .datefield input{background:var(--sunken);border:1px solid var(--line-2);color:var(--text);
     border-radius:var(--r);padding:0 12px;height:var(--h);font-size:13px;font-family:var(--f-mono);color-scheme:dark}

  /* ---------- STAGE / GRID ---------- */
  #stage{grid-area:stage;background:var(--bg);position:relative;overflow:hidden}
  #grid{display:grid;gap:10px;padding:16px 20px;width:100%;height:100%;align-content:start;grid-auto-rows:1fr}
  .cell{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;
     min-width:0;--cx:var(--accent);
     background:var(--tile) repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px)}
  .cell.s-conn{--cx:var(--warn);border-color:var(--warn-dim)}
  .cell.s-off{--cx:var(--error);border-color:var(--error-dim)}
  .cell canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#05070b}
  .cx{position:absolute;width:12px;height:12px;z-index:3;pointer-events:none}
  .cx.tl{top:6px;left:6px;border-top:2px solid var(--cx);border-left:2px solid var(--cx)}
  .cx.tr{top:6px;right:6px;border-top:2px solid var(--cx);border-right:2px solid var(--cx)}
  .cx.bl{bottom:6px;left:6px;border-bottom:2px solid var(--cx);border-left:2px solid var(--cx)}
  .cx.br{bottom:6px;right:6px;border-bottom:2px solid var(--cx);border-right:2px solid var(--cx)}
  .cell.big .cx{width:20px;height:20px;top:10px;bottom:10px;left:10px;right:10px}
  .cell.big .cx.tl{bottom:auto;right:auto} .cell.big .cx.tr{bottom:auto;left:auto}
  .cell.big .cx.bl{top:auto;right:auto} .cell.big .cx.br{top:auto;left:auto}
  .cell .tag{position:absolute;top:13px;left:20px;z-index:4;display:flex;align-items:baseline;gap:8px;
     white-space:nowrap;overflow:hidden;right:96px}
  .cell .tag b{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em}
  .cell .tag span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .cell .ip{position:absolute;bottom:12px;left:20px;z-index:4;font-family:var(--f-mono);font-size:11px;color:var(--muted);
     text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .badge{position:absolute;top:11px;right:20px;z-index:4;display:flex;align-items:center;gap:6px;
     font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;background:rgba(6,8,11,.7);padding:3px 7px;border-radius:3px}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .badge.live{color:var(--accent)} .badge.live .d{background:var(--accent)}
  .badge.load{color:var(--warn)} .badge.load .d{background:var(--warn)}
  .badge.err{color:var(--error)} .badge.err .d{background:var(--error);width:8px;height:2px;border-radius:0}
  .cell .ph{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:10px;color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.12em}
  .cell .ph svg{width:28px;height:28px;stroke:currentColor}
  .cell.s-conn .ph{color:var(--warn)} .cell.s-off .ph{color:var(--error)}
  .cell .tools{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:5px;opacity:0;transition:opacity .15s}
  .cell:hover .tools{opacity:1}
  .cell .tools button{width:30px;height:30px;border-radius:var(--r-sm);background:rgba(6,8,11,.78);
     border:1px solid var(--line-2);display:grid;place-items:center;backdrop-filter:blur(4px)}
  .cell .tools button:hover{background:var(--accent);border-color:var(--accent)}
  .cell .tools button:hover svg{stroke:var(--bg)}
  .cell .tools svg{width:15px;height:15px;stroke:var(--text)}
  .cell.full{position:fixed;inset:0;z-index:60;border-radius:0;background:#000}

  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:16px;color:var(--faint);text-align:center;padding:40px}
  #empty svg{width:46px;height:46px;stroke:#2a3644}
  #empty h3{color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:16px}
  #empty p{font-size:13px;max-width:360px;line-height:1.6}

  /* ---------- TRANSPORT ---------- */
  #transport{grid-area:transport;background:var(--surface);border-top:1px solid var(--line);
     display:none;flex-direction:column;padding:12px 20px 16px;gap:12px}
  body.mode-playback #transport{display:flex}
  .tp-top{display:flex;align-items:center;gap:16px}
  .tp-ctrls{display:flex;align-items:center;gap:6px}
  .tp-ctrls button{width:var(--h);height:var(--h);border-radius:var(--r);background:var(--surface-2);
     border:1px solid var(--line-2);display:grid;place-items:center}
  .tp-ctrls button:hover{background:#111824}
  .tp-ctrls button.play{width:52px;background:var(--accent);border-color:var(--accent)}
  .tp-ctrls button.play:hover{background:var(--accent-2)}
  .tp-ctrls svg{width:18px;height:18px;stroke:var(--text);fill:none}
  .tp-ctrls .play svg{fill:var(--bg);stroke:none}
  .tp-clock{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:.5px}
  .tp-clock small{font-size:12px;color:var(--muted);margin-left:10px}
  .tp-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .speedsel{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
  .speedsel button{min-width:46px;height:var(--h);font-family:var(--f-mono);font-size:12px;color:var(--text-2)}
  .speedsel button+button{border-left:1px solid var(--line)}
  .speedsel button.active{background:var(--accent);color:var(--bg)}

  .tl-head{display:flex;justify-content:space-between;align-items:center}
  .tl-head h2{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
  .tl-legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
  .tl-legend span{display:flex;align-items:center;gap:6px}
  .lg-rec{width:12px;height:7px;background:var(--accent-dim)}
  .lg-ev{width:3px;height:13px;background:var(--warn)}
  .timeline{position:relative;height:52px;background:var(--bg);border:1px solid var(--line);
     border-radius:var(--r-sm);overflow:hidden;cursor:pointer;user-select:none}
  .tl-hours{position:absolute;inset:0}
  .tl-hour{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.04)}
  .tl-hour span{position:absolute;top:4px;left:5px;font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
  .tl-seg{position:absolute;top:20px;height:22px;background:var(--rec-fill);border-radius:2px}
  .tl-seg.event{top:6px;height:30px;width:3px!important;background:var(--warn);border-radius:0}
  .tl-play{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);pointer-events:none}
  .tl-tip{position:absolute;top:-25px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);
     padding:2px 7px;border-radius:var(--r-sm);font-family:var(--f-mono);font-size:11px;pointer-events:none;display:none;white-space:nowrap}
  .tl-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-family:var(--f-mono);font-size:12px}

  /* ---------- MODAL ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(3,5,8,.7);backdrop-filter:blur(3px);
     display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.show{display:flex}
  .modal{width:460px;max-width:92vw;background:var(--surface);border:1px solid var(--line-2);
     border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.6);overflow:hidden}
  .modal h2{font-family:var(--f-display);font-size:16px;font-weight:600;padding:18px 20px;border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:10px}
  .modal h2 svg{width:18px;height:18px;stroke:var(--accent)}
  .modal .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
  .field input{background:var(--sunken);border:1px solid var(--line-2);color:var(--text);
     border-radius:var(--r);padding:0 12px;height:var(--h);font-size:14px;outline:none;font-family:inherit}
  .field input:focus{border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 110px;gap:12px}
  .modal .foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .modal .foot .spacer{flex:1}
  .testmsg{font-size:13px;font-family:var(--f-mono);padding:9px 12px;border-radius:var(--r);display:none}
  .testmsg.ok{display:block;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-dim)}
  .testmsg.bad{display:block;background:#1a0e0e;color:var(--error);border:1px solid var(--error-dim)}
  .hint{font-size:12.5px;color:var(--faint);line-height:1.55}
</style>
</head>
<body class="mode-live">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="#35E0D0" stroke-width="1.8" stroke-linejoin="round"><path d="M16 3 27 9.5v13L16 29 5 22.5v-13z"/><circle cx="16" cy="16" r="5"/><circle cx="16" cy="16" r="1.4" fill="#35E0D0" stroke="none"/></svg>
      <div class="wm">ZORNIX</div>
    </div>
    <div class="nav" id="modeswitch">
      <button data-mode="live" class="active"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span data-i18n="nav.live">Live view</span></button>
      <button data-mode="playback"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="nav.playback">Recordings</span></button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="search" data-i18n-ph="search.ph" placeholder="Search cameras…">
    </div>
    <div class="camlist" id="camlist"></div>
    <div class="statcard">
      <div class="h" data-i18n="stat.title">CAMERA STATUS</div>
      <div class="statrow"><span class="l"><span class="sd live"></span><span data-i18n="stat.online">Online</span></span><span class="v" id="cnt-live">0</span></div>
      <div class="statrow"><span class="l"><span class="sd conn"></span><span data-i18n="stat.conn">Connecting</span></span><span class="v" id="cnt-conn">0</span></div>
      <div class="statrow"><span class="l"><span class="sd off"></span><span data-i18n="stat.off">No signal</span></span><span class="v" id="cnt-off">0</span></div>
    </div>
    <div class="side-foot">
      <span class="count" id="selcount"></span>
      <button class="btn ghost sm" id="btn-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="btn.settings">Settings</span>
      </button>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header id="topbar">
    <button class="collapse" id="btn-collapse" data-i18n-title="btn.collapse" title="Hide sidebar (B)"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div id="viewtitle">Live view<small id="viewsub"></small></div>
    <span class="vlan" id="netbadge" style="display:none"></span>
    <div class="spacer"></div>
    <div id="live-ctrls" style="display:flex;align-items:center;gap:12px">
      <div class="pager" id="pager" style="display:none">
        <button id="pg-prev"><svg viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7"/></svg></button>
        <span id="pg-info"></span>
        <button id="pg-next"><svg viewBox="0 0 24 24" fill="none"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
      <div class="seg" id="layoutseg">
        <button data-n="1">1</button><button data-n="4">2×2</button>
        <button data-n="9" class="active">3×3</button><button data-n="16">4×4</button><button data-n="25">5×5</button>
      </div>
      <button class="btn accent sm" id="btn-refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg><span data-i18n="btn.refresh">Refresh</span></button>
    </div>
    <div id="pb-ctrls" style="display:none;align-items:center;gap:10px">
      <div class="datefield">
        <input type="date" id="pb-date">
        <button class="btn sm" id="pb-today" data-i18n="btn.today">Today</button>
        <button class="btn sm" id="pb-yest" data-i18n="btn.yesterday">Yesterday</button>
      </div>
    </div>
  </header>

  <!-- STAGE -->
  <section id="stage">
    <div id="grid"></div>
    <div id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 7h12v10H3z"/><path d="m15 10 6-3v10l-6-3"/></svg>
      <h3 id="empty-h">Pick cameras on the left</h3>
      <p id="empty-p"></p>
    </div>
  </section>

  <!-- TRANSPORT -->
  <footer id="transport">
    <div class="tp-top">
      <div class="tp-ctrls">
        <button id="tp-back" data-i18n-title="tp.back" title="−10 s (←)"><svg viewBox="0 0 24 24"><path d="M11 19l-7-7 7-7"/><path d="M20 19l-7-7 7-7"/></svg></button>
        <button class="play" id="tp-play" data-i18n-title="tp.play" title="Play / pause (space)"><svg id="tp-play-ic" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg></button>
        <button id="tp-fwd" data-i18n-title="tp.fwd" title="+10 s (→)"><svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7"/><path d="M4 5l7 7-7 7"/></svg></button>
      </div>
      <div class="tp-clock"><span id="tp-time">--:--:--</span><small id="tp-date"></small></div>
      <div class="tp-right">
        <div class="speedsel" id="speedsel">
          <button data-s="0.5">0.5×</button><button data-s="1" class="active">1×</button>
          <button data-s="2">2×</button><button data-s="4">4×</button><button data-s="8">8×</button>
        </div>
      </div>
    </div>
    <div class="tl-head">
      <h2 data-i18n="tl.title">TIMELINE · 24 H</h2>
      <div class="tl-legend"><span><span class="lg-rec"></span><span data-i18n="tl.rec">recording</span></span><span><span class="lg-ev"></span><span data-i18n="tl.event">event</span></span></div>
    </div>
    <div class="timeline" id="timeline">
      <div class="tl-hours" id="tl-hours"></div>
      <div class="tl-empty" id="tl-empty" data-i18n="tl.empty">Pick a camera and a day to see recorded segments</div>
      <div class="tl-play" id="tl-play" style="display:none"></div>
      <div class="tl-tip" id="tl-tip"></div>
    </div>
  </footer>

  <!-- SETTINGS MODAL -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg><span data-i18n="nvr.title">NVR connection</span></h2>
      <div class="body">
        <p class="hint" data-i18n="nvr.hint"></p>
        <div class="row2">
          <div class="field"><label data-i18n="nvr.ip">NVR IP ADDRESS</label><input id="nvr-ip" placeholder="192.168.x.x"></div>
          <div class="field"><label data-i18n="nvr.port">PORT</label><input id="nvr-port" value="34567"></div>
        </div>
        <div class="row2">
          <div class="field"><label data-i18n="nvr.user">USERNAME</label><input id="nvr-user" value="admin"></div>
          <div class="field"><label data-i18n="nvr.pass">PASSWORD</label><input id="nvr-pass" type="password" placeholder="••••••"></div>
        </div>
        <div class="testmsg" id="testmsg"></div>
      </div>
      <div class="foot">
        <button class="btn" id="btn-test" data-i18n="nvr.test">Test connection</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="btn-cancel" data-i18n="nvr.cancel">Cancel</button>
        <button class="btn primary" id="btn-save" data-i18n="nvr.save">Save</button>
      </div>
    </div>
  </div>

  <script src="jsmpeg.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
